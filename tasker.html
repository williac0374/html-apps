<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name='apple-mobile-web-app-capable' content='yes' />
<meta name='viewport' content='initial-scale=1.0, maximum-scale=1.0, user-scalable=0, width=device-width, height=device-height' />
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent' />
<title>MAP</title>
<style>
/* CSS to disable scrolling and set fullscreen */
html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
}
canvas {
  border: 2px solid #000;
  background-color: white;
  display: block;
  margin: 0 auto;
}

</style>
</head>
<body>
<div id="game-container" style="background: black; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
<canvas id="canvas" width="560" height="560"></canvas>
</div>

<script>

monthName=['January','February','March','April','May','June','July','August','September','Octorber','November','December']
month = [
{ name: 1 , start: 4 , end: 31 },
{ name: 2 , start: 0 , end: 28 },
{ name: 3 , start: 0 , end: 31 },
{ name: 4 , start: 3 , end: 30 },
{ name: 5 , start: 5 , end: 31 },
{ name: 6 , start: 1 , end: 30 },
{ name: 7 , start: 3 , end: 31 },
{ name: 8 , start: 6 , end: 31 },
{ name: 9 , start: 2 , end: 30 },
{ name: 10 , start: 4 , end: 31 },
{ name: 11 , start: 0 , end: 30 },
{ name: 12 , start: 2 , end: 31 },
]
cells = []
cellW = 80
cellH = 80
function start(){
  draw_set_color(255,255,255)
  setTimeout(function(){
    canvas.width=screen.width
    canvas.height=screen.height
    cellW = canvas.width/7
    cellH = canvas.height/7
    let now = new Date();
    displayedMonth = now.getMonth()
    turn_page(displayedMonth)
  },10)
  
  let now = new Date();
  displayedMonth = now.getMonth()
  turn_page(displayedMonth)
}
function loop(){
  if(mouse_check_pressed()){
    const container = document.getElementById('game-container');
    requestFullscreen(container);
    canvas.width=screen.height
    canvas.height=screen.height
    cellW = canvas.width/7
    cellH = canvas.height/7
    turn_page(displayedMonth)
  }
  document.title = mouse_x
}
function draw(){
  draw_cells()
  draw_gui()
}

function turn_page(mnth){
  if(cells.length>0){
    cells = []
  }
  var date = 1
  var tick = 0
  document.title=monthName[mnth]
  for(let y = 0; y < canvas.height-cellH-4; y+=cellH ){
    for(let x = 0; x < canvas.width; x+=cellW ){
    let temp = {x:x,y:y,date:0}
      if ( tick >= month[mnth].start && date<= month[mnth].end){
        temp.date=date
        date++
      }
      cells.push(temp)
      tick++
    }
  }
}
function draw_cells(){
  for(let c = 0;c < cells.length;c++){
    draw_set_color(0,0,0)
    draw_set_linewidth(1)
    draw_rectangle(cells[c].x, cells[c].y, cellW, cellH, 1, 0, 0, 0)
    let now = new Date();
    let m = now.getMonth()
    let d = now.getDate()
    if(cells[c].date == d && displayedMonth==m){
      draw_set_color(0,255,0)
      draw_set_linewidth(5)
      draw_rectangle(cells[c].x+5, cells[c].y+5, cellW-10, cellH-10, 1, 0, 0, 0)
    }
    if(!cells[c].date==0){
      draw_set_color(0,0,0)
      draw_text(cells[c].x+2,cells[c].y+2,cells[c].date)
    }
    
  }
}
function draw_gui(){
  let l = 5
  let t = cellH*6+5
  draw_set_color(0,0,255)
  draw_set_linewidth(3)
  draw_rectangle(l, t, cellW*1.25, cellH-10, 1, 0, 0, 0)
  draw_centered_text(l+(cellW*1.25)/2, t+(cellH*0.4375), "PREV", 22, 500)
  if(inside(mouse_x, mouse_y, l, t, cellW*1.25, cellH-10, 1, 0, 0, 0)){
    if(mouse_check_pressed()){
      displayedMonth--
      if(displayedMonth==-1){
        displayedMonth=11
      }
    }
  }
  draw_rectangle(l+(cellW*5.625), t, cellW*1.25, cellH-10, 1, 0, 0, 0)
  draw_centered_text(l+(cellW*6.25), t+(cellH*0.4375), "NEXT", 22, 500)
  
  draw_centered_text(canvas.width/2, t+(cellH*0.4375), monthName[displayedMonth], 48, 700)
}
</script>
<script type='text/javascript' src='engine.js'></script>
</body>
</html>
