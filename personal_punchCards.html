<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Personal Punch Cards</title>
  <meta name="theme-color" content="#fef8e7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  
  <link rel="manifest" href="manifest.json" />

  <style>
    :root {
      --bg-card: #fffdf5;
      --line-blue: #cce0f5;
      --line-red: #ffb3b3;
      --text-ink: #2b2b2b;
      --text-muted: #888888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }

    body {
      background-color: #d1d5db;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .card-container {
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #dcd6cd;
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 2px solid var(--line-red);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 179, 179, 0.1);
    }
    .date-selector {
      border: none;
      background: transparent;
      font-weight: bold;
      font-size: 1rem;
      color: var(--text-ink);
      outline: none;
    }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .star-badge { font-size: 1.4rem; filter: grayscale(100%); opacity: 0.3; transition: all 0.3s ease; }
    .star-badge.earned { filter: grayscale(0%); opacity: 1; transform: scale(1.2); }
    .today-btn {
      font-size: 0.75rem;
      padding: 2px 6px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }

    .tabs { display: flex; border-bottom: 1px solid #e5e0d8; }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: #eae5dc;
      border: none;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
    }
    .tab.active { background: var(--bg-card); color: var(--text-ink); border-bottom: 2px solid var(--text-ink); }

    .card-body { flex: 1; padding: 10px; display: flex; flex-direction: column; }
    .view-pane { display: none; flex: 1; flex-direction: column; }
    .view-pane.active { display: flex; }

    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
    .column {
      background: linear-gradient(to bottom, transparent 27px, var(--line-blue) 28px);
      background-size: 100% 28px;
      line-height: 28px;
      display: flex;
      flex-direction: column;
    }
    .column-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      color: #718096;
      border-bottom: 1px solid var(--line-blue);
      margin-bottom: 4px;
      height: 24px;
      line-height: 24px;
    }

    .task-item {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0 4px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }
    .task-label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }
    .task-item.completed .task-label { text-decoration: line-through; color: var(--text-muted); }
    
    .copy-btn {
      font-size: 0.7rem;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 3px;
      padding: 0 4px;
      height: 20px;
      line-height: 18px;
      color: var(--text-ink);
    }

    .add-task-form { margin-top: 6px; }
    .add-task-form input {
      width: 100%;
      height: 26px;
      border: none;
      border-bottom: 1px dashed var(--text-muted);
      background: transparent;
      outline: none;
      font-size: 0.85rem;
      padding: 0 4px;
    }
    textarea.notes-area {
      width: 100%;
      height: 100%;
      min-height: 250px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-ink);
    }
  </style>
</head>
<body>

<div class="card-container">
  <div class="card-header">
    <input type="date" id="datePicker" class="date-selector" onchange="changeDate(this.value)" />
    <div class="header-right">
      <button id="todayBtn" class="today-btn" onclick="jumpToToday()">Jump to Today</button>
      <span class="star-badge" id="starBadge">⭐</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('front')">FRONT (Commitments)</button>
    <button class="tab" onclick="switchTab('back')">BACK (Notes/Ideas)</button>
  </div>

  <div class="card-body">
    <div id="paneFront" class="view-pane active">
      <div class="columns">
        <div class="column">
          <div class="column-title">Work</div>
          <div id="workList"></div>
          <form class="add-task-form" id="workForm" onsubmit="addTask(event, 'work')">
            <input type="text" id="workInput" placeholder="+ Add Work Task" autocomplete="off" />
          </form>
        </div>

        <div class="column">
          <div class="column-title">Personal</div>
          <div id="personalList"></div>
          <form class="add-task-form" id="personalForm" onsubmit="addTask(event, 'personal')">
            <input type="text" id="personalInput" placeholder="+ Add Personal Task" autocomplete="off" />
          </form>
        </div>
      </div>
    </div>

    <div id="paneBack" class="view-pane">
      <textarea id="notesArea" class="notes-area" placeholder="Scratchpad for phone numbers, code comments, or ideas..." oninput="saveNotes()"></textarea>
    </div>
  </div>
</div>

<script>
  const getTodayKey = () => new Date().toISOString().split('T')[0];
  let todayKey = getTodayKey();
  let selectedKey = todayKey;
  let cardData = { work: [], personal: [], notes: "" };

  function loadCard(dateKey) {
    selectedKey = dateKey;
    document.getElementById('datePicker').value = selectedKey;
    
    // Show 'Jump to Today' button whenever selected date is not today
    document.getElementById('todayBtn').style.display = (selectedKey === todayKey) ? 'none' : 'block';

    const stored = localStorage.getItem(`punchcard_${selectedKey}`);
    cardData = stored ? JSON.parse(stored) : { work: [], personal: [], notes: "" };
    document.getElementById('notesArea').value = cardData.notes || "";
    render();
  }

  function save() {
    localStorage.setItem(`punchcard_${selectedKey}`, JSON.stringify(cardData));
    render();
  }

  function changeDate(newDate) {
    if (newDate) loadCard(newDate);
  }

  function jumpToToday() {
    loadCard(todayKey);
  }

  function addTask(e, category) {
    e.preventDefault();
    const input = document.getElementById(`${category}Input`);
    const val = input.value.trim();
    if (!val) return;

    cardData[category].push({ text: val, completed: false });
    input.value = "";
    save();
  }

  function toggleTask(category, index) {
    cardData[category][index].completed = !cardData[category][index].completed;
    save();
  }

  function editTask(category, index) {
    const currentText = cardData[category][index].text;
    const updatedText = prompt("Edit task (leave blank to delete):", currentText);
    
    if (updatedText !== null) {
      const trimmed = updatedText.trim();
      if (trimmed === "") {
        cardData[category].splice(index, 1);
      } else {
        cardData[category][index].text = trimmed;
      }
      save();
    }
  }

  function copyToToday(category, text, event) {
    event.stopPropagation();
    let todayData = JSON.parse(localStorage.getItem(`punchcard_${todayKey}`)) || { work: [], personal: [], notes: "" };
    todayData[category].push({ text: text, completed: false });
    localStorage.setItem(`punchcard_${todayKey}`, JSON.stringify(todayData));
    alert(`Copied "${text}" to today's card!`);
  }

  function saveNotes() {
    cardData.notes = document.getElementById('notesArea').value;
    localStorage.setItem(`punchcard_${selectedKey}`, JSON.stringify(cardData));
  }

  function attachLongPress(element, category, index) {
    let timer = null;
    let isLongPress = false;

    const start = () => {
      isLongPress = false;
      timer = setTimeout(() => {
        isLongPress = true;
        editTask(category, index);
      }, 500);
    };

    const clear = () => {
      if (timer) clearTimeout(timer);
    };

    element.onpointerdown = start;
    element.onpointerup = () => {
      clear();
      if (!isLongPress) {
        toggleTask(category, index);
      }
    };
    element.onpointerleave = clear;
    element.onpointercancel = clear;
  }

  function render() {
    ['work', 'personal'].forEach(cat => {
      const container = document.getElementById(`${cat}List`);
      container.innerHTML = "";
      cardData[cat].forEach((task, idx) => {
        const div = document.createElement('div');
        div.className = `task-item ${task.completed ? 'completed' : ''}`;
        
        const leftDiv = document.createElement('div');
        leftDiv.className = 'task-left';
        
        const check = document.createElement('span');
        check.innerText = task.completed ? '✓' : '•';

        const label = document.createElement('span');
        label.className = 'task-label';
        label.innerText = task.text;

        leftDiv.appendChild(check);
        leftDiv.appendChild(label);
        div.appendChild(leftDiv);

        attachLongPress(leftDiv, cat, idx);

        // Show copy button if viewing a past date card with incomplete tasks
        if (selectedKey < todayKey && !task.completed) {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.innerText = '+ Today';
          copyBtn.onclick = (e) => copyToToday(cat, task.text, e);
          div.appendChild(copyBtn);
        }

        container.appendChild(div);
      });
    });

    const totalTasks = cardData.work.length + cardData.personal.length;
    const completedTasks = cardData.work.filter(t => t.completed).length + cardData.personal.filter(t => t.completed).length;
    const starBadge = document.getElementById('starBadge');
    
    if (totalTasks > 0 && totalTasks === completedTasks) {
      starBadge.classList.add('earned');
    } else {
      starBadge.classList.remove('earned');
    }
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
    
    if (tab === 'front') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('paneFront').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('paneBack').classList.add('active');
    }
  }

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(caches.open('pwa-v6').then(c => c.add('./'))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  }

  loadCard(todayKey);
</script>
</body>
</html>
